apiVersion: v1
kind: PersistentVolume
metadata:
  name: ai-token-dashboard-postgres-pv
spec:
  capacity:
    storage: 40Gi
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ai-token-dashboard-local
  hostPath:
    path: /Data/k3s-storage/postgres
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: ai-token-dashboard
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ai-token-dashboard-local
  resources:
    requests:
      storage: 40Gi
  volumeName: ai-token-dashboard-postgres-pv
---
