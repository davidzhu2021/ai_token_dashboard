services:
  usage-db:
    image: postgres:16-alpine
    container_name: ai-token-dashboard-db
    environment:
      POSTGRES_DB: ai_usage
      POSTGRES_USER: ai_dashboard
      POSTGRES_PASSWORD: ${USAGE_DB_PASSWORD:?USAGE_DB_PASSWORD must be set}
    volumes:
      - usage-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_dashboard -d ai_usage"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Self-hosted outbound MTA. Listens only on the internal compose network --
  # no host port is published, so nothing on the internet can use it as a relay.
  # It delivers straight to each recipient's MX on port 25 and signs with DKIM.
  mail-relay:
    image: boky/postfix:latest
    container_name: ai-token-dashboard-mail
    hostname: ${MAIL_RELAY_HELO_NAME:-mail.notify.carher.net}
    environment:
      ALLOWED_SENDER_DOMAINS: ${MAIL_RELAY_SENDER_DOMAINS:?MAIL_RELAY_SENDER_DOMAINS must be set}
      # HELO name. Must be a host name distinct from the sender domain: if it
      # equals the sender domain, Postfix considers itself the final
      # destination for that domain and bounce reports fail with
      # "mail ... loops back to myself".
      POSTFIX_myhostname: ${MAIL_RELAY_HELO_NAME:-mail.notify.carher.net}
      POSTFIX_mydestination: localhost
      # Deliver over IPv4 only; the host has no outbound IPv6 mail reputation.
      POSTFIX_inet_protocols: ipv4
      POSTFIX_smtp_tls_security_level: may
      DKIM_SELECTOR: ${MAIL_RELAY_DKIM_SELECTOR:-mail}
      # Generate a DKIM keypair per sender domain on first start. Without this
      # the image runs OpenDKIM but signs nothing, and Gmail rejects with
      # "550-5.7.26 ... DKIM = did not pass".
      DKIM_AUTOGENERATE: "true"
    volumes:
      - mail-relay-dkim:/etc/opendkim/keys
      - mail-relay-spool:/var/spool/postfix
    healthcheck:
      test: ["CMD-SHELL", "postfix status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  ai-token-dashboard:
    build:
      context: .
    image: ai-token-dashboard:latest
    container_name: ai-token-dashboard
    env_file:
      - .env
    environment:
      USAGE_SYNC_ROLE: reader
      USAGE_DB_POOL_MIN_SIZE: ${USAGE_WEB_DB_POOL_MIN_SIZE:-1}
      USAGE_DB_POOL_MAX_SIZE: ${USAGE_WEB_DB_POOL_MAX_SIZE:-5}
    volumes:
      - key-vault-data:/app/.data
    depends_on:
      usage-db:
        condition: service_healthy
      mail-relay:
        condition: service_started
    ports:
      - "8000:8000"
    restart: unless-stopped

  usage-sync-worker:
    build:
      context: .
    image: ai-token-dashboard:latest
    container_name: ai-token-dashboard-usage-sync
    command: ["python", "-m", "backend.usage_worker"]
    env_file:
      - .env
    environment:
      USAGE_SYNC_ROLE: worker
      USAGE_DB_POOL_MIN_SIZE: ${USAGE_WORKER_DB_POOL_MIN_SIZE:-1}
      USAGE_DB_POOL_MAX_SIZE: ${USAGE_WORKER_DB_POOL_MAX_SIZE:-3}
    volumes:
      - key-vault-data:/app/.data
    depends_on:
      usage-db:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: unless-stopped

volumes:
  key-vault-data:
  usage-db-data:
  mail-relay-dkim:
  mail-relay-spool:
